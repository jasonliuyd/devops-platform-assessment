name: Shared CI

on:
  workflow_call:
    inputs:
      build_script:
        description: Path to the application build script
        required: true
        type: string
      test_script:
        description: Path to the application test script
        required: true
        type: string

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2
          
      - name: Security Scan
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          skip-setup-trivy: true

      - name: Infrastructure Security Scan
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: config
          scan-ref: ./infra
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          skip-setup-trivy: true
          
      - name: Validate script paths
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
          TEST_SCRIPT: ${{ inputs.test_script }}
        run: |
          test -f "$BUILD_SCRIPT"
          test -f "$TEST_SCRIPT"

      - name: Build application
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: bash "$BUILD_SCRIPT"

      - name: Run tests
        env:
          TEST_SCRIPT: ${{ inputs.test_script }}
        run: bash "$TEST_SCRIPT"
